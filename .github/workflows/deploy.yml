name: Build & deploy (static → S3 + CloudFront)

# Runs after the 3-day update commits a refreshed catalog, and on demand.
# Requires these repository secrets/variables:
#   secrets.AWS_DEPLOY_ROLE_ARN   IAM role trusted by GitHub OIDC (no long-lived keys)
#   vars.AWS_REGION               e.g. us-east-1
#   vars.S3_BUCKET                e.g. skillloadout-site
#   vars.CLOUDFRONT_DISTRIBUTION  e.g. E123ABC...
#   vars.SITE_URL                 https://skillloadout.com
# Optional: vars.GA_ID, vars.ADSENSE_CLIENT, vars.ADSENSE_SLOT_RAIL_TOP, vars.ADSENSE_SLOT_RAIL_BOTTOM,
#           vars.BMC_USERNAME, vars.KOFI_USERNAME, vars.GITHUB_SPONSORS, vars.CONTACT_EMAIL, vars.SPONSOR_EMAIL

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update skills (every 3 days)"]
    types: [completed]

permissions:
  contents: read
  id-token: write # for AWS OIDC

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skip if the update workflow failed
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SITE_NAME: Skill Loadout
      NEXT_PUBLIC_SITE_TAGLINE: Gear up your AI
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      NEXT_PUBLIC_SPONSOR_EMAIL: ${{ vars.SPONSOR_EMAIL }}
      NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
      NEXT_PUBLIC_ADS_PROVIDER: ${{ vars.ADS_PROVIDER }}
      NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      NEXT_PUBLIC_ADSENSE_SLOT_RAIL_TOP: ${{ vars.ADSENSE_SLOT_RAIL_TOP }}
      NEXT_PUBLIC_ADSENSE_SLOT_RAIL_BOTTOM: ${{ vars.ADSENSE_SLOT_RAIL_BOTTOM }}
      NEXT_PUBLIC_BMC_USERNAME: ${{ vars.BMC_USERNAME }}
      NEXT_PUBLIC_KOFI_USERNAME: ${{ vars.KOFI_USERNAME }}
      NEXT_PUBLIC_GITHUB_SPONSORS: ${{ vars.GITHUB_SPONSORS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Validate catalog
        run: node scripts/validate.mjs

      - name: Build artifacts (zips, search index, ads.txt)
        run: node scripts/build-artifacts.mjs

      - name: Build static site
        run: npm run build --workspace apps/web

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Long-cache the fingerprinted assets and the zips; short-cache the HTML so an update
      # shows up as soon as the invalidation lands.
      - name: Upload immutable assets
        run: |
          aws s3 sync apps/web/out/_next/static "s3://${{ vars.S3_BUCKET }}/_next/static" \
            --cache-control "public,max-age=31536000,immutable" --delete
          aws s3 sync apps/web/out/downloads "s3://${{ vars.S3_BUCKET }}/downloads" \
            --cache-control "public,max-age=604800" --content-type "application/zip" --delete
          aws s3 sync apps/web/out/bundles "s3://${{ vars.S3_BUCKET }}/bundles" \
            --cache-control "public,max-age=604800" --content-type "application/zip" --delete

      - name: Upload pages
        run: |
          aws s3 sync apps/web/out "s3://${{ vars.S3_BUCKET }}" \
            --exclude "_next/static/*" --exclude "downloads/*" --exclude "bundles/*" \
            --cache-control "public,max-age=300,must-revalidate" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION }}" \
            --paths "/" "/index.html" "/browse*" "/categories*" "/stacks*" "/updates*" "/search-index.json" "/sitemap.xml"

      - name: Summary
        run: |
          echo "### Deployed $(date -u +%F' '%T) UTC" >> $GITHUB_STEP_SUMMARY
          node -e "const s=require('./catalog/stats.json');console.log('- '+s.total+' skills, '+s.mirrored+' downloadable, '+s.sources+' sources')" >> $GITHUB_STEP_SUMMARY
          du -sh apps/web/out | awk '{print "- build size: "$1}' >> $GITHUB_STEP_SUMMARY
