name: Update skills (weekly, Fridays)

on:
  schedule:
    # Fridays 00:23 UTC (05:53 Sri Lanka) so new skills are live before the weekend.
    # Off-the-hour minute: GitHub delays top-of-hour schedules under load.
    - cron: "23 0 * * 5"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download every source even if unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Claude review steps are optional: without this secret, discovery is skipped and safety
      # verdicts are only re-applied from cache. Reviews happen in the /friday-update Claude Code
      # skill on a subscription instead.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Discovery agent — find & review new skill sources
        if: env.HAS_ANTHROPIC_KEY == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/discover.mjs

      - name: Sync all sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync.mjs ${{ inputs.force && '--force' || '' }}

      - name: Apply safety verdicts (reviews new flags only if a key is set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/verify-safety.mjs

      - name: Keep ⚡ Superpower picks valid
        run: node scripts/resolve-picks.mjs

      - name: Validate catalog
        run: node scripts/validate.mjs

      - name: Rebuild Claude Code plugin marketplace
        run: node scripts/build-marketplace.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain catalog skills .claude-plugin)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "world-skills-bot"
          git config user.email "world-skills-bot@users.noreply.github.com"
          git add catalog skills .claude-plugin
          SUMMARY=$(node -e "const c=require('./catalog/changelog.json')[0];console.log('+'+c.added+' ~'+c.updated+' -'+c.removed+' (total '+c.total+')')")
          git commit -m "chore(skills): scheduled update $SUMMARY"
          git push
